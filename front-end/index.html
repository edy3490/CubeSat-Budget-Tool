<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CubeSat Budget Tool</title>
<style>
:root{--bg:#f4f5f7;--pane:#fff;--card:#eef0f3;--line:#d9dce2;--fg:#16181d;--muted:#626976;--user-bg:#dbe8ff;--user-fg:#0f3a85;--accent:#3b5bdb;--accent2:#0f9d8a;--ok:#157a4f;--warn:#b06a00;--bad:#c2332b;--solar:#dbe5ff;--solar-line:#9fb4ee;--payload:#fbe9d2;--payload-line:#e2b982;--avi:#d8efe3;--avi-line:#8fc9aa;--batt:#dbe5ff;--batt-line:#9fb4ee;--sans:system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0d16;--pane:#141a2b;--card:#1b2338;--line:#2a3550;--fg:#eceef0;--muted:#98a0aa;--user-bg:#0a2147;--user-fg:#7fb0ff;--accent:#7fa2ff;--accent2:#5eead4;--ok:#58d39a;--warn:#f5a524;--bad:#ff7a70;--solar:#0b2150;--solar-line:#1f3f86;--payload:#3a1f06;--payload-line:#6b4414;--avi:#0b3322;--avi-line:#1d6446;--batt:#0b2150;--batt-line:#1f3f86;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);padding-inline:16px}
[hidden]{display:none!important}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
/* landing */
.land{min-height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding-block:32px}
.hero{text-align:center;margin-bottom:24px}
.hero h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:16px}
.box{display:flex;gap:10px;align-items:center;background:var(--pane);border:1px solid var(--line);border-radius:20px;padding:10px 10px 10px 18px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.box:focus-within{border-color:var(--accent)}
.box input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;padding:8px 0}
.box button{width:42px;height:42px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#071018;font-size:18px;padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;color:var(--muted);background:transparent}
.chip:hover{color:var(--fg);border-color:var(--accent)}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}
/* workspace */
.app{height:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:14px}
header{display:flex;justify-content:space-between;align-items:center}
h2{font-size:15px;margin:0}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:14px}
.pane{background:var(--pane);border:1px solid var(--line);border-radius:14px;min-height:0;min-width:0}
.chat{display:flex;flex-direction:column}
.log{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user-bg);color:var(--user-fg)}
.msg.ai{align-self:flex-start;border:1px solid var(--line)}
.msg.err{align-self:flex-start;border:1px solid var(--bad);color:var(--bad)}
.msg.typing{color:var(--muted)}
.wchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dash{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border-radius:10px;padding:12px 14px}
.k{color:var(--muted);font-size:13px}.v{font-size:28px;font-weight:500}.s{font-size:13.5px;color:var(--muted)}
.s.ok{color:var(--ok)}.s.tight{color:var(--warn)}.s.over{color:var(--bad)}
.meter{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}
.meter.tight i{background:var(--warn)}.meter.over i{background:var(--bad)}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 0 7px 14px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left;padding-left:0}
th{font-weight:400;color:var(--muted)}tbody tr+tr td{border-top:1px solid var(--line)}
td small{display:block;color:var(--muted);font-size:12px}tfoot td{border-top:1px solid var(--fg);font-weight:600}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.notes li{display:flex;gap:8px}.notes li::before{content:"";width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none;background:var(--muted)}
.notes li.warn::before{background:var(--warn)}.notes li.bad::before{background:var(--bad)}.notes li.good::before{background:var(--ok)}
.sketchrow{display:flex;justify-content:center}svg text{font:12.5px var(--sans);fill:var(--fg)}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
@media (max-width:900px){html,body,.app{height:auto}.main{grid-template-columns:minmax(0,1fr)}.chat{height:70vh}.dash{overflow:visible}}
</style>
</head>
<body>
<section class="land" id="land">
  <div class="hero">
    <h1>Budget your <span>CubeSat</span> mission</h1>
    <p>Describe a satellite. Get a mass, power and cost budget.</p>
  </div>
  <form class="box" id="landForm">
    <input id="landInput" type="text" autocomplete="off" placeholder="e.g. A 6U CubeSat that images wildfires for 1 year" aria-label="Describe your satellite">
    <button type="submit" aria-label="Start">➤</button>
  </form>
  <div class="chips" id="landChips"></div>
  <div class="note">Early-design estimates only. Verify before flight.</div>
</section>

<div class="app" id="ws" hidden>
  <header><h2>CubeSat Budget Tool</h2><button id="resetBtn" type="button">New design</button></header>
  <div class="main">
    <section class="pane chat" aria-label="Chat">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="wchips" id="chips"></div>
      <form class="composer" id="form">
        <input id="input" type="text" autocomplete="off" placeholder="Describe a satellite or change the design" aria-label="Message">
        <button class="primary" type="submit" id="sendBtn">Send</button>
      </form>
    </section>
    <section class="pane dash" aria-label="Budget">
      <div class="stats">
        <div class="stat"><div class="k">Mass</div><div class="v" id="massV">-</div><div class="s" id="massS"></div><div class="meter" id="massM"><i></i></div></div>
        <div class="stat"><div class="k">Power (peak draw)</div><div class="v" id="powV">-</div><div class="s" id="powS"></div><div class="meter" id="powM"><i></i></div></div>
        <div class="stat"><div class="k">Mission cost</div><div class="v" id="costV">-</div><div class="s" id="costS"></div></div>
      </div>
      <div><p class="label">Subsystems</p><div class="tablewrap"><table>
        <thead><tr><th>Subsystem</th><th>kg</th><th>W</th><th>$k</th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr><td>Total</td><td id="tMass"></td><td id="tPow"></td><td id="tCost"></td></tr></tfoot>
      </table></div></div>
      <div><p class="label">Flags</p><ul class="notes" id="notes"></ul></div>
      <div><p class="label">Stack sketch</p><div class="sketchrow"><svg id="sketch" width="360" height="300" viewBox="0 0 360 300" role="img" aria-label="Stack sketch"></svg></div></div>
    </section>
  </div>
</div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const log = $("log");
let spec = {}, history = [], busy = false;
const fmt = n => (Math.round(n*10)/10).toString();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function localApi(url, body){
  if (url === "/api/budget"){ const s = {...DEF}; return {spec:s, budget:budget(s)}; }
  const s = {...DEF, ...(body.spec||{})}, t = body.messages[body.messages.length-1].content, ch = [];
  let m;
  if ((m = t.match(/(\d+)\s*u\b/i)) && +m[1] >= 1 && +m[1] <= 27){ s.units = +m[1]; ch.push(s.units+"U"); }
  if ((m = t.match(/(\d+(\.\d+)?)\s*km/i))){ s.altitude = +m[1]; ch.push(s.altitude+" km"); }
  if ((m = t.match(/(\d+(\.\d+)?)\s*(yr|year)/i))){ s.years = +m[1]; ch.push(s.years+" yr"); }
  const pk = payKey(t); if (pk){ s.payload = pk; ch.push(PAY[pk].n.toLowerCase()); }
  const reply = ch.length ? "Updated the design: " + ch.join(", ") + ". Check the budget on the right." : "I didn’t catch a change. Try “make it a 12U”, “raise the orbit to 700 km”, “add a methane spectrometer” or “extend to 3 years”.";
  return {reply, spec:s, budget:budget(s)};
}

/* ---------- transport ---------- */
async function post(url, body){
  const res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!res.ok){
    let d = ""; try{ d = (await res.json()).detail || ""; }catch(e){}
    throw new Error("Server returned " + res.status + (d ? ": " + (typeof d === "string" ? d : JSON.stringify(d)) : ""));
  }
  return res.json();
}

/* ---------- dashboard ---------- */
function setMeter(id, ratio, state){
  const m = $(id);
  m.className = "meter " + (state === "ok" ? "" : state);
  m.firstElementChild.style.width = Math.min(100, Math.round(ratio*100)) + "%";
}
function render(b){
  $("massV").textContent = fmt(b.mass) + " kg";
  $("massS").textContent = "of " + b.maxMass + " max";
  $("powV").textContent = fmt(b.watts) + " W";
  const ps = $("powS");
  ps.textContent = b.powState === "ok" ? "margin ok" : b.powState === "tight" ? "tight" : "over budget";
  ps.className = "s " + b.powState;
  $("costV").textContent = "~$" + Math.round(b.cost) + "k";
  $("costS").textContent = "hardware + launch";
  setMeter("massM", b.massRatio, b.massState);
  setMeter("powM", b.powRatio, b.powState);
  $("rows").innerHTML = b.rows.map(r =>
    `<tr><td>${esc(r.name)}${r.note ? `<small>${esc(r.note)}</small>` : ""}</td><td>${fmt(r.kg)}</td><td>${fmt(r.w)}</td><td>${Math.round(r.k)}</td></tr>`).join("");
  $("tMass").textContent = fmt(b.mass); $("tPow").textContent = fmt(b.watts); $("tCost").textContent = Math.round(b.cost);
  $("notes").innerHTML = b.notes.map(n => `<li class="${n[0]}">${esc(n[1])}</li>`).join("");
  drawSketch(b);
}
function drawSketch(b){
  const units = b.units, cx = 180, bodyW = 140;
  const unitH = Math.min(36, 240/units), H = Math.max(3, units)*unitH, top = (300-H)/2;
  const pH = H*.34, aH = H*.30, bH = H-pH-aH, panelW = 56, panelH = H*.66, py = top+H*.17;
  const box = (x,y,w,h,f,s,t) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--${f})" stroke="var(--${s})"/><text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle">${t}</text>`;
  $("sketch").innerHTML =
    `<text x="${cx}" y="${Math.max(14, top-8)}" text-anchor="middle" style="fill:var(--muted)">${esc(b.form)} · ${esc(b.altitude)} km · ${esc(b.years)} yr</text>` +
    box(cx-bodyW/2-panelW-6, py, panelW, panelH, "solar", "solar-line", "Solar") +
    box(cx+bodyW/2+6, py, panelW, panelH, "solar", "solar-line", "Solar") +
    box(cx-bodyW/2, top, bodyW, pH, "payload", "payload-line", esc(b.label)) +
    box(cx-bodyW/2, top+pH, bodyW, aH, "avi", "avi-line", "Avionics + radio") +
    box(cx-bodyW/2, top+pH+aH, bodyW, bH, "batt", "batt-line", "Battery");
}

/* ---------- chat ---------- */
function addMsg(kind, text){
  const d = document.createElement("div");
  d.className = "msg " + kind; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function showError(err){
  const hint = /Failed to fetch|NetworkError/.test(err.message) ? " Is the API running, and is this page served from it?" : "";
  addMsg("err", err.message + "." + hint);
}
async function send(text){
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; $("sendBtn").disabled = true;
  addMsg("user", text);
  history.push({role:"user", content:text});
  $("input").value = "";
  const typing = addMsg("ai typing", "Working on it...");
  try{
    const out = await post("/api/cubesat-chat", {messages:history, spec});
    typing.remove();
    addMsg("ai", out.reply || "Updated the design.");
    history.push({role:"assistant", content:out.reply || ""});
    if (out.spec) spec = out.spec;
    if (out.budget) render(out.budget);
  }catch(err){ typing.remove(); showError(err); history.pop(); }
  busy = false; $("sendBtn").disabled = false; $("input").focus();
}
async function reset(){
  spec = {}; history = []; log.innerHTML = "";
  addMsg("ai", "Describe the mission and I’ll build a mass, power and cost budget. For example: a 6U CubeSat that images wildfires from low Earth orbit for 1 year.");
  const loading = addMsg("ai typing", "Loading starter design...");
  try{ const out = await post("/api/budget", {}); spec = out.spec || {}; render(out.budget); }
  catch(err){ showError(err); }
  loading.remove();
}

/* ---------- landing -> workspace handoff ---------- */
async function enter(text){
  text = text.trim(); if (!text) return;
  $("land").hidden = true; $("ws").hidden = false;
  await reset();
  send(text);
}
function leave(){ $("ws").hidden = true; $("land").hidden = false; $("landInput").value = ""; $("landInput").focus(); }

["A 6U CubeSat that images wildfires for 1 year","12U with a methane spectrometer at 700 km","3U radio relay at 500 km for 2 years"].forEach(s => {
  const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = s;
  c.onclick = () => enter(s); $("landChips").appendChild(c);
});
["Make it a 12U","Raise the orbit to 700 km","Add a methane spectrometer","Extend to 3 years"].forEach(s => {
  const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = s;
  c.onclick = () => send(s); $("chips").appendChild(c);
});
$("landForm").addEventListener("submit", e => { e.preventDefault(); enter($("landInput").value); });
$("form").addEventListener("submit", e => { e.preventDefault(); send($("input").value); });
$("resetBtn").addEventListener("click", leave);
})();
</script>
</body>
</html>
